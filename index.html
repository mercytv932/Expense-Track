<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense</title>
  <style></style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <div class="container">
  <div class="inputAndBtn">
  <input type="text" id="itemNameInput" placeholder="title...">
  <input type="text" id="itemAmountInput" placeholder="$...">
  <button class="add">Add</button>
  </div>
  <div id="totalDisplay"></div>
  <div id="listContainer"></div>
  </div>

  <script>
    const itemNameInput = document.querySelector("#itemNameInput");
    const itemAmountInput = document.querySelector("#itemAmountInput");
    const add = document.querySelector(".add");
    const inputAndBtn = document.querySelector(".inputAndBtn")
    const totalDisplay = document.querySelector("#totalDisplay");
    const listContainer = document.querySelector("#listContainer");
    const container = document.querySelector(".container");

    let expenses = [];


    add.addEventListener("click", ()=>{
      const name = itemNameInput.value;
      const amount = itemAmountInput.value;

      const newDiv = document.createElement("div");
      const nameP = document.createElement("p");
      nameP.textContent = itemNameInput.value;
      const amountP = document.createElement("p");
      amountP.textContent = itemAmountInput.value;

      newDiv.appendChild(nameP);
      newDiv.appendChild(amountP);

      listContainer.appendChild(newDiv);

       const newExpense = {
        name: itemNameInput.value,
        amount:itemAmountInput.value
    }

      expenses.push(newExpense);
      console.log(expenses);
    });

  </script>
</body>
</html>
