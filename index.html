<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background-color: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      align-items: flex-start;
      padding-top: 60px;
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: rgba(255, 255, 255, 0.08);
      background-color: aliceblue;
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <h1>Expense Tracker</h1>
  <div class="container">
  <div class="inputAndBtn">
  <input type="text" id="itemNameInput" placeholder="title...">
  <input type="text" id="itemAmountInput" placeholder="$...">
  <button class="add">Add</button>
  </div>
  <div id="totalDisplay"></div>
  <div id="listContainer"></div>
  </div>

  <script>
    const itemNameInput = document.querySelector("#itemNameInput");
    const itemAmountInput = document.querySelector("#itemAmountInput");
    const add = document.querySelector(".add");
    const inputAndBtn = document.querySelector(".inputAndBtn")
    const totalDisplay = document.querySelector("#totalDisplay");
    const listContainer = document.querySelector("#listContainer");
    const container = document.querySelector(".container");

    let expenses = [];


    add.addEventListener("click", ()=>{
      const name = itemNameInput.value;
      const amount = itemAmountInput.value;

       const newExpense = {
        name: itemNameInput.value,
        amount:itemAmountInput.value
    }

      expenses.push(newExpense);
      renderExpenses();
      updateTotal();
      itemNameInput.value = "";
      itemAmountInput.value = "";
    });

    function renderExpenses(){
      listContainer.innerHTML = "";

      expenses.forEach(expense => {
        const renderDiv = document.createElement("div");

        const newP = document.createElement("p");
        newP.textContent = expense.name;
      
        const newP1 = document.createElement("p");
        newP1.textContent = expense.amount;

        const deletBtn = document.createElement("button");
        deletBtn.textContent = "X";

        deletBtn.addEventListener("click", ()=>{
          expenses = expenses.filter(item => item !== expense);
          renderExpenses();
          updateTotal();
        });

        renderDiv.appendChild(newP);
        renderDiv.appendChild(newP1);
        renderDiv.appendChild(deletBtn);
        listContainer.appendChild(renderDiv);
      });
    }

    function updateTotal(){
      let total = 0;
      expenses.forEach(expense=>{

        total += Number(expense.amount);
      });

      totalDisplay.textContent = `Total: $${total}`;

    }

    localStorage.setItem("expenses", JSON.stringify(expenses));

    function loadFromStorage(){
      const storedExpenses = localStorage.getItem('expenses');

    if(storedExpenses){
    
      try{
    const parsedExpenses = JSON.parse(storedExpenses);

    expenses = parsedExpenses;
    renderExpenses();
    updateTotal();
    } catch(error) {
    console.error("Error parsing expenses from localStoarge:", error);
    expenses = [];

    }
  }
}
    loadFromStorage();

  </script>
</body>
</html>
